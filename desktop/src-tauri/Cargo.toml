[package]
name = "flow-desktop"
version = "0.1.1"
description = "语流 Flow 桌面版：网页内容 + 系统媒体控制、复习提醒、开机自启"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "flow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# Automatic updates, on since 0.1.1 (desktop/README.md「自动更新」); `--no-default-features` builds without them.
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-updater = { version = "2.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
log = { version = "0.4", features = ["std"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
souvlaki = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSDate", "NSCalendar", "NSArray", "NSError", "NSSet", "NSValue", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSettings", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
