# 语流 Flow 运营后台 API (xmc.hk/flow/api/ -> Flow admin port 8091, FLOW_ADMIN_PORT in /etc/flow.env).
# UI is static in /www/wwwroot/xmc.hk/flow/. Only xmc.hk (behind Cloudflare Access) proxies here;
# flowlang.cn and flow.jasa.hk (the 内测版) never reach the admin port.
location ^~ /flow/api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    client_max_body_size 16k;
}
