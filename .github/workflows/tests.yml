name: Tests
# A pull request is tested once, by its pull_request run; main is tested again after each merge. Testing every
# branch push as well ran each PR twice: with five PRs being tested that took all 20 jobs a free account runs at
# once, so the next push had to wait (2026-11-24).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # one process: 18–25 min on a hosted runner (2026-11-24, ~630 tests); #48 hit the old 25-min limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive policy checks
        run: python -m unittest discover -s tests -v
      - name: Reproducible upgrade archive and extracted boot check
        run: python tools/release.py check
      - name: Website regression tests
        working-directory: flow
        run: python -m unittest discover -s tests -v
      - name: Gateway regression tests
        working-directory: flow-gateway
        run: python -m unittest discover -s tests -v
  ui:
    # tools/ui_test.py: every page on a phone, a phone held sideways, a tablet and a desktop, with touch, keyboard
    # and mouse; uses the runner's Google Chrome through Playwright and a local server with a simulated AI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # one process: 21–24 min on a hosted runner (2026-11-24, ~2000 checks); room for the class pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright (driving the installed Chrome)
        run: python -m pip install --quiet playwright==1.49.1
      - name: Built front end matches its source parts
        run: python tools/build_front.py --check && python tools/build_dictionary.py --check
      - name: Multi-device UI tests
        run: python tools/ui_test.py /tmp/ui-out
      - name: Screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/ui-out
          retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # r20: the classic site and its behavior tests are archived (archive/classic/); the learning site's behavior is
      # covered by the ui job. Here: the built files match their parts, and every script the site serves parses.
      - name: Frontend build and syntax checks
        run: |
          python3 tools/build_front.py --check
          for js in flow/public/next.js flow/public/sw.js flow/public/survey.js flow/public/about.js xmc-admin/admin.js; do
            node --check "$js"
          done
