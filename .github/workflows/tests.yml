name: Tests
# A pull request is tested once, by its pull_request run; main is tested again after each merge. Testing every
# branch push as well ran each PR twice: with five PRs being tested that took all 20 jobs a free account runs at
# once, so the next push had to wait (2026-11-24).
#
# The suites run in shares at the same time (tools/run_tests.py splits them): 2 website shares and 5 UI shares, about
# 6 minutes each, instead of one 25-minute job each. main's protection rule asks for the checks "backend", "ui" and
# "frontend": the "backend" and "ui" jobs below pass only when every one of their shares passed. One run takes 8
# runners at once (of the 20 a free account has), so two pull requests can be tested side by side.
#
# main's runs are never cancelled by the next merge (they were, and with merges in a row no run on main finished, so
# no 内测版 went out: 2026-11-25, b12 stayed for hours); of the runs waiting, GitHub keeps the newest. A pull request's
# older run is cancelled by its newer push. A pull request that touches nothing the UI tests depend on (tools/run_tests.py
# UI_INPUTS: not the website, not the UI tools) skips the 5 UI shares, so it takes 3 runners, not 8.
#
# The heavy jobs (2 website shares, 5 UI shares) can run on the owner's MSI instead (self-hosted runners labelled msi,
# tools/msi-setup.sh), off the 20-job limit. tools/ci_runner.py picks the machine in the 'changes' job, before they are
# queued: the MSI only when the repository variable MSI_RUNNER is "on", the run is main's or a pull request from this
# repository (never a fork's), and the MSI answers a probe within seconds; otherwise GitHub's machines, as before.
# The gates, frontend and every release stay on GitHub's machines. On the MSI a job keeps its temporary files in its
# runner's own folder (TMPDIR), which the runner clears after the job; no secret ever goes there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # whether the UI shares run (always on main; on a pull request, when it touches anything the UI depends on), and
    # where the shares run (tools/ci_runner.py pick: the MSI or GitHub's machines)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write  # to dispatch the MSI probe; a fork's pull request gets a read-only token and never asks
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
      runner: ${{ steps.pick.outputs.runner }}
      where: ${{ steps.pick.outputs.where }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a pull request's merge commit and main before it
      - id: paths
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo ui=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only HEAD^1 HEAD | tee /dev/stderr | python3 tools/run_tests.py --ui-needed >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - id: pick
        env:
          MSI_RUNNER: ${{ vars.MSI_RUNNER }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_runner.py pick
  msi-watch:
    # if the MSI went away in the seconds after it answered, its jobs would wait a day (and on main block every later
    # run): past 10 minutes without a machine, this cancels the run, and for main asks for a new one
    needs: changes
    if: needs.changes.outputs.where == 'msi'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_runner.py watch
  backend-share:
    name: backend ${{ matrix.share }}/2
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 15  # a share took about 4 minutes (2026-11-24); the whole suite in one job took 18–25
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Temporary files in this runner's own folder (cleared after the job; the MSI runs several jobs at once)
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.where != 'msi'
        with:
          python-version: '3.11'
      - name: Python 3.11 on the MSI (tools/msi-setup.sh installs it), in a venv of this job's own
        if: needs.changes.outputs.where == 'msi'
        run: python3.11 -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Playwright (prints the 操作指南 PDF with the installed Chrome)
        run: python -m pip install --quiet playwright==1.49.1
      - name: The files a release builds (next.js, next.css, the guide PDF and its manifest)
        run: python tools/build_release.py --here
      - name: Archive policy checks
        if: matrix.share == 1
        run: python -m unittest discover -s tests -v
      - name: Reproducible upgrade archive and extracted boot check
        if: matrix.share == 1
        run: python tools/release.py check
      - name: Website regression tests (this share, 4 files at once)
        run: python tools/run_tests.py --shard ${{ matrix.share }}/2 --jobs 4
      - name: Gateway regression tests
        if: matrix.share == 2
        working-directory: flow-gateway
        run: python -m unittest discover -s tests -v
  backend:
    # the check main's protection rule asks for; runs when a share failed too (a skipped check would count as passed)
    needs: backend-share
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every website share passed
        run: test "${{ needs.backend-share.result }}" = success
  ui-share:
    # tools/ui_test.py: every page on a phone, a phone held sideways, a tablet and a desktop, with touch, keyboard
    # and mouse; uses the runner's Google Chrome through Playwright and a local server with a simulated AI. Each share
    # runs some of its groups (tools/run_tests.py UI_SHARDS) against a server of its own.
    name: ui ${{ matrix.share }}/5
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 15  # a share took about 6 minutes (2026-11-24); all groups in one job took 21–24
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Temporary files in this runner's own folder (cleared after the job; the MSI runs several jobs at once)
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.where != 'msi'
        with:
          python-version: '3.11'
      - name: Python 3.11 on the MSI (tools/msi-setup.sh installs it), in a venv of this job's own
        if: needs.changes.outputs.where == 'msi'
        run: python3.11 -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Playwright (driving the installed Chrome)
        run: python -m pip install --quiet playwright==1.49.1
      - name: Front end built from its parts
        run: python tools/build_front.py
      - name: Multi-device UI tests (this share's groups)
        run: python tools/run_tests.py --ui --shard ${{ matrix.share }}/5 --out "$RUNNER_TEMP/ui-out"
      - name: Screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.share }}
          path: ${{ runner.temp }}/ui-out
          retention-days: 7
  ui:
    # passes when every UI share passed, or when the pull request touches nothing the UI depends on (shares skipped)
    needs: [changes, ui-share]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every UI share passed (or none was needed)
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.ui }}" = false ]; then echo "this pull request changes nothing the UI tests depend on: UI shares skipped"
          else test "${{ needs.ui-share.result }}" = success; fi
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # r20: the classic site and its behavior tests are archived (archive/classic/); the learning site's behavior is
      # covered by the ui job. Here: the front end builds from its parts, every script the site serves parses, and the
      # prebuilt dictionary matches its sources.
      - name: Frontend build and syntax checks
        run: |
          python tools/build_front.py
          python tools/build_dictionary.py --check
          for js in flow/public/next.js flow/public/sw.js flow/public/survey.js flow/public/about.js xmc-admin/admin.js; do
            node --check "$js"
          done
