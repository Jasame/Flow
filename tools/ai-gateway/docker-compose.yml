# The AI gateway for Flow: New API (github.com/QuantumNous/new-api, AGPL-3.0), one OpenAI-compatible address with
# the vendors behind it (DeepSeek, Qwen, Gemini …) chosen and switched in its console. setup.sh copies this file to
# /opt/ai-gateway and starts it; README.md is the checklist.
#
# One container with SQLite in ./data: enough for one Flow site (no PostgreSQL or Redis to run and back up).
# ./data holds the vendors' API keys: keep it private (setup.sh makes the folder 700) and back it up with the server.
services:
  new-api:
    # Pinned. The project's releases are named v1.0.0-rc.N and are full releases (not marked pre-release on GitHub).
    # rc.49 (2026-11-08) has rc.48's signed session caches and the SQLite WAL fix. Upgrade on purpose: README「升级」.
    image: calciumion/new-api:v1.0.0-rc.49
    container_name: ai-gateway
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      # Only this machine: Flow calls http://127.0.0.1:3000/v1 directly, and nginx serves the console as api.xmc.hk.
      - "127.0.0.1:${AI_GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file: .env  # SESSION_SECRET, written once by setup.sh (mode 600); never commit or paste it
    environment:
      - TZ=Asia/Shanghai
      - DEFAULT_LANGUAGE=zh-CN
      - NODE_NAME=ai-gateway-hk
      - ERROR_LOG_ENABLED=true
      # The console is reached over HTTPS through Cloudflare and nginx.
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://api.xmc.hk
      # nginx on the host reaches the container through a Docker bridge network.
      - TRUSTED_PROXIES=172.16.0.0/12
      # Every model call comes from Flow on this machine (one address), and the relay is closed to the internet:
      # 1800 per 180 s (10 a second) instead of the default 360, so a busy hour is not throttled.
      - GLOBAL_API_RATE_LIMIT=1800
      - GLOBAL_API_RATE_LIMIT_DURATION=180
      # Flow gives up on a stream after 100 s; the gateway waits a little longer for a silent upstream.
      - STREAMING_TIMEOUT=120
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
