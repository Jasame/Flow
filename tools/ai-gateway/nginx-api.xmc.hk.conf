# For the 宝塔 site api.xmc.hk (README.md 第 2 步). In the site's 配置文件:
#   1. delete the default static-file blocks 宝塔 adds, or the console's JS/CSS are looked for on disk and 404:
#        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { ... }
#        location ~ .*\.(js|css)?$ { ... }
#   2. replace the default `location /` with the two blocks below. Keep 宝塔's SSL lines as they are.
#
# The model relay is closed to the internet: Flow calls the gateway on 127.0.0.1, so /v1 and the other relay paths
# never need to be public. Only the console is served here, and Cloudflare Access sits in front of it.

location ~ ^/(v1|v1beta|v2|mj|suno|kling|jimeng|pg)(/|$) {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
